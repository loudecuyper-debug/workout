<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0F1322">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png?v=3">
<title>Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1322;--card:#191F33;--card2:#1F2640;--card3:#2A3150;--line:#2A3150;
  --text:#EEF0F7;--muted:#9AA1B8;--ghost:#5D6580;
  --accent:#EEF0F7;--accent-ink:#0F1322;--warn:#FF8A5B;--info:#FFC23D;
  --mc:#EEF0F7; /* kleur van de spiergroep op het scherm */
  --c-borst:#FF6B5B;--c-rug:#4D9DFF;--c-benen:#3DD68C;--c-schouders:#FFC23D;--c-armen:#B78CFF;--c-core:#3CCFCF;
  --r:18px;
  --cond:'Big Shoulders Display',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--st) + 16px) 20px calc(var(--sb) + 20px)}
.app.has-nav{padding-bottom:calc(var(--sb) + 96px)}
.eyebrow{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.eyebrow.acc{color:var(--mc)}
.h1{font-family:var(--cond);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase}
.h2{font-family:var(--cond);font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grow{flex:1;min-width:0}
.num{font-family:var(--cond);font-weight:700}
.big-num{font-family:var(--cond);font-weight:800;font-size:30px;line-height:1}
.btn{min-height:52px;border-radius:16px;background:var(--card2);font-weight:600;font-size:16px;padding:0 16px}
.btn-big{min-height:68px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-family:var(--cond);font-weight:800;font-size:28px;letter-spacing:1px;width:100%;text-transform:uppercase}
.btn-light{background:var(--text);color:var(--bg)}
.btn-danger{color:var(--warn)}
.icon-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-6px -10px 8px}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#232B45;color:var(--info);white-space:nowrap}
.tag.pr{background:#2E2A2A}
.daypick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.daypick button{height:48px;border-radius:12px;background:var(--card2);font-family:var(--cond);font-weight:700;font-size:16px}
.daypick button.on{background:var(--accent);color:var(--accent-ink)}
.seg6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.seg6 span{height:8px;border-radius:4px;background:var(--card3)}
.seg6 span.past{background:var(--text)}.seg6 span.now{background:var(--accent)}
.seg6 span.light{border:1px dashed #3A4260}
.bars{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;gap:8px 10px;align-items:center;font-size:14px}
.bars .track{height:8px;border-radius:4px;background:var(--card3);position:relative;overflow:hidden}
.bars .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--text)}
.bars .track i{opacity:.55}.bars .track i.ok{opacity:1}
.bars .track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#3A4260}
.goal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card)}
.goal .box{width:22px;height:22px;border-radius:6px;border:2px solid #3A4260;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.goal.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* workout */
.sets{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:16px}
.set{height:56px;border-radius:10px;background:var(--card2);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center}
.set b{font-family:var(--cond);font-weight:800;font-size:22px;line-height:1}
.set span{font-size:11px;font-weight:600}
.set.done{background:var(--mc);color:var(--accent-ink)}
.set.cur{border:2px solid var(--mc);color:var(--mc)}
.counter{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.counter .pm{width:76px;height:76px;border-radius:22px;background:var(--card2);font-size:38px}
.counter .val{display:flex;flex-direction:column;align-items:center}
.counter .val b{font-family:var(--cond);font-weight:800;font-size:132px;line-height:.9}
.counter .val b.ghost{color:var(--ghost);font-style:italic}
.ladder{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ladder button{height:44px;min-width:64px;padding:0 14px;border-radius:999px;background:var(--card2);color:var(--muted);font-family:var(--cond);font-weight:700;font-size:20px}
.ladder button.on{background:transparent;border:2px solid var(--text);color:var(--text);font-weight:800}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--card);font-size:14px;line-height:1.4}
.suggest{display:block;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 16px}
.spacer{flex:1}
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);max-width:456px;margin:0 auto;background:#191F33;border:1px solid var(--mc);border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;z-index:10}
.timer .t{font-family:var(--cond);font-weight:800;font-size:40px;color:var(--mc);line-height:1}
.timer .bar{height:4px;border-radius:2px;background:#2A3150;margin-top:6px}
.timer .bar i{display:block;height:4px;border-radius:2px;background:var(--mc)}
.timer button{height:48px;padding:0 14px;border-radius:12px;background:#2A3150;font-weight:600}
.timer.over{border-color:var(--warn)}.timer.over .t{color:var(--warn)}
.stepper{background:var(--card2);align-items:center;min-height:46px}.seg.stepper button{min-width:44px;height:40px;font-size:22px;color:var(--text)}
.chip{min-height:34px;padding:0 10px;border-radius:9px;background:var(--card2);font-family:var(--cond);font-weight:700;font-size:16px}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.fold svg{transition:transform .2s}.fold[aria-expanded="true"] svg{transform:rotate(180deg)}
/* kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 30px;gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:700;color:var(--ghost);padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:16px;color:var(--muted);background:var(--card2);min-width:0}
.cal .d.out{background:transparent;color:transparent}
.cal .d.fut{background:transparent;color:var(--ghost)}
.cal .d.hit{color:var(--accent-ink);background:var(--dc)}
.cal .d.light{background:transparent;border:2px solid var(--dc);color:var(--dc)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--text)}
.cal .wk{display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;font-size:15px;color:var(--ghost)}
.cal .wk.ok{color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.entering .cal .d.hit{animation:pop .4s var(--spring) both}}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,19,34,.96);border-top:1px solid var(--line);padding:6px 8px calc(var(--sb) + 6px);z-index:5}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.nav button.on{color:var(--accent)}
select.pick{width:100%;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px;font-size:17px;font-weight:600;-webkit-appearance:none;appearance:none}
.chart{width:100%;height:auto;display:block}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{height:36px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card3);color:var(--text)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw}
.diag{font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;color:var(--muted);word-break:break-word}
/* ============ ANIMATIES: alleen als iOS "Beperk beweging" uit staat ============ */
@media (prefers-reduced-motion:no-preference){
  :root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
  .set,.ladder button,.daypick button,.seg button,.nav button{transition:background .18s,color .18s,border-color .18s}
  button,.btn,.btn-big,.suggest{transition:transform .12s var(--ease),background .18s,opacity .18s}
  button:active{transform:scale(.96)}
  .btn-big:active,.suggest:active{transform:scale(.98)}
  .in{animation:rise .34s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .set.pop{animation:pop .42s var(--spring)}
  @keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .counter .val b.bump-up{animation:bumpUp .2s var(--ease)}
  .counter .val b.bump-down{animation:bumpDown .2s var(--ease)}
  @keyframes bumpUp{from{transform:translateY(8px) scale(.94);opacity:.6}to{transform:none;opacity:1}}
  @keyframes bumpDown{from{transform:translateY(-8px) scale(.94);opacity:.6}to{transform:none;opacity:1}}
  .timer.slide{animation:slideUp .32s var(--ease) both}
  @keyframes slideUp{from{transform:translateY(120%)}to{transform:none}}
  .timer.over{animation:glow 1.2s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,138,91,.25)}}
  .entering .bars .track i{animation:grow .7s var(--ease) both;animation-delay:.15s;transform-origin:left}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .entering .seg6 span.now{animation:pop .5s var(--spring) .2s both}
  .goal.done .box{animation:pop .4s var(--spring)}
  .toast:not([hidden]){animation:drop .26s var(--ease)}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translateX(-50%)}}
  .h1.slam{animation:slam .5s var(--spring) both}
  @keyframes slam{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<nav id="nav" class="nav" hidden></nav>
<div id="toast" class="toast" role="status" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script id="rules">
/* ============ REGELS: pure functies, geen DOM, geen opslag ============ */
var Rules = (function(){
  var LADDER = [2, 3.25, 4.5, 7, 9.5, 12, 14.5, 17];
  var DAY = 86400000, WEEK = 7 * DAY;
  var BLOCK_WEEKS = 6, MIN_WEEK = 3, FULL_WEEK = 5, MAX_FREE = 3;

  function parseRange(s){
    var m = /^(\d+)\s*-\s*(\d+)$/.exec(String(s||'').trim());
    if (m) return { min: +m[1], max: +m[2] };
    m = /^(\d+)$/.exec(String(s||'').trim());
    if (m) return { min: +m[1], max: +m[1] };
    return null; // "max", "45-60s", "8/been": geen automatische progressie
  }
  function ladderIndex(kg){
    for (var i = 0; i < LADDER.length; i++) if (Math.abs(LADDER[i] - kg) < 0.01) return i;
    return -1;
  }
  function nextStep(kg){ var i = ladderIndex(kg); return (i >= 0 && i < LADDER.length - 1) ? LADDER[i + 1] : null; }
  function prevStep(kg){ var i = ladderIndex(kg); return i > 0 ? LADDER[i - 1] : null; }

  function nextDayIndex(sessions, dayCount){
    if (!sessions.length) return 0;
    return (sessions[sessions.length - 1].dayIndex + 1) % dayCount;
  }

  function entriesFor(sessions, exId){
    var out = [];
    for (var i = sessions.length - 1; i >= 0; i--) {
      var e = sessions[i].exercises.find(function(x){ return x.id === exId; });
      if (e) out.push(e);
    }
    return out;
  }
  function lastRepsFor(sessions, exId, setIdx){
    var es = entriesFor(sessions, exId);
    for (var i = 0; i < es.length; i++) {
      var s = es[i].sets[setIdx];
      if (s && s.done && s.reps > 0) return s.reps;
    }
    return null;
  }
  function doneSets(entry){ return entry ? entry.sets.filter(function(s){ return s && s.done; }) : []; }
  function hitTop(entry, ex, kg){
    var r = parseRange(ex.reps);
    if (!r || !entry) return false;
    var done = doneSets(entry);
    if (done.length < ex.sets) return false;
    return done.every(function(s){ return s.kg === kg && s.reps >= r.max; });
  }
  // Double progression: eerst reps tot de top van de range op alle sets, dan de volgende stap.
  // Elleboog-oefeningen: twee sessies op rij. Niet in de lichte week.
  function suggestion(sessions, ex, kg, deload){
    if (deload || !kg || !parseRange(ex.reps)) return null;
    var nxt = nextStep(kg);
    if (nxt === null) return null;
    var es = entriesFor(sessions, ex.id);
    var need = ex.elbow ? 2 : 1;
    if (es.length < need) return null;
    for (var i = 0; i < need; i++) if (!hitTop(es[i], ex, kg)) return null;
    return { from: kg, to: nxt, reason: ex.elbow ? 'Twee sessies op rij de top van de range gehaald.' : 'Top van de range gehaald op alle sets.' };
  }
  // Hoeveel reps nog tot de volgende stap (laatste sessie op dit gewicht).
  function repsToNext(sessions, ex, kg){
    var r = parseRange(ex.reps);
    if (!r || !kg || nextStep(kg) === null) return null;
    var need = ex.sets * r.max, have = 0;
    var last = entriesFor(sessions, ex.id)[0];
    if (last) doneSets(last).forEach(function(s){ if (s.kg === kg) have += Math.min(s.reps, r.max); });
    return { have: have, need: need, to: nextStep(kg) };
  }

  function restAfter(day, exIdx){
    var ex = day.exercises[exIdx];
    if (ex.ss) return 0;
    return ex.rest || 60;
  }
  function remaining(endsAt, now){ return Math.ceil((endsAt - now) / 1000); }

  function isComplete(active, day){
    return day.exercises.every(function(ex){
      var e = active.exercises.find(function(x){ return x.id === ex.id; });
      return e && e.sets.length >= ex.sets && e.sets.slice(0, ex.sets).every(function(s){ return s && s.done; });
    });
  }

  function warmup(day, exIdx){
    var first = day.exercises.findIndex(function(e){ return e.kg > 0 && parseRange(e.reps); });
    if (exIdx !== first) return null;
    var lo = prevStep(day.exercises[exIdx].kg);
    return lo === null ? null : { kg: lo, reps: 10 };
  }

  function weekStart(ts){
    var d = new Date(ts); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getTime();
  }
  function weeksBetween(a, b){ return Math.round((weekStart(b) - weekStart(a)) / WEEK); }

  // Blok van 6 weken, gerekend vanaf de week van je eerste sessie. Week 6 is lichter.
  function blockInfo(sessions, now){
    var start = sessions.length ? weekStart(sessions[0].endedAt) : weekStart(now);
    var w = Math.max(0, weeksBetween(start, now));
    var week = (w % BLOCK_WEEKS) + 1;
    return { block: Math.floor(w / BLOCK_WEEKS) + 1, week: week, light: week === BLOCK_WEEKS };
  }

  function weekCounts(sessions){
    var c = {};
    sessions.forEach(function(s){ var k = weekStart(s.endedAt); c[k] = (c[k] || 0) + 1; });
    return c;
  }
  // Reeks in weken met minstens 3 trainingen. Elk blok geeft 1 vrije week, een volle week (5/5) nog 1 (max 3).
  // Een vrije week vangt een gemiste week op zonder dat de reeks breekt.
  function streakInfo(sessions, now){
    var counts = weekCounts(sessions), cur = weekStart(now);
    var thisWeek = counts[cur] || 0;
    if (!sessions.length) return { streak: 0, free: 1, thisWeek: 0, usedFree: 0 };
    var first = weekStart(sessions[0].endedAt);
    var n = weeksBetween(first, now);
    var streak = 0, free = 0, used = 0;
    for (var i = 0; i < n; i++) {
      if (i % BLOCK_WEEKS === 0) free = Math.min(MAX_FREE, free + 1);
      var wk = weekStart(first + i * WEEK + DAY * 3);
      var c = counts[wk] || 0;
      if (c >= MIN_WEEK) { streak++; if (c >= FULL_WEEK) free = Math.min(MAX_FREE, free + 1); }
      else if (streak > 0 && free > 0) { free--; used++; }
      else streak = 0;
    }
    if (n % BLOCK_WEEKS === 0) free = Math.min(MAX_FREE, free + 1);
    if (thisWeek >= MIN_WEEK) streak++;
    return { streak: streak, free: free, thisWeek: thisWeek, usedFree: used };
  }

  function inWeek(sessions, now){ var w = weekStart(now); return sessions.filter(function(s){ return weekStart(s.endedAt) === w; }); }

  // Gedane sets per spiergroep deze week. exInfo(id) geeft { muscle }.
  function muscleSets(sessions, now, exInfo){
    var out = {};
    inWeek(sessions, now).forEach(function(s){
      s.exercises.forEach(function(e){
        var m = (exInfo(e.id) || {}).muscle; if (!m) return;
        out[m] = (out[m] || 0) + doneSets(e).length;
      });
    });
    return out;
  }

  function totalReps(entry){ return doneSets(entry).reduce(function(a, s){ return a + (s.reps || 0); }, 0); }
  function topKg(entry){ return doneSets(entry).reduce(function(a, s){ return Math.max(a, s.kg || 0); }, 0); }

  // Vergelijk elke oefening van een sessie met de vorige keer (sessies ervoor).
  function compareToPrevious(sessionsBefore, session){
    return session.exercises.map(function(e){
      var prev = entriesFor(sessionsBefore, e.id)[0];
      if (!prev) return { id: e.id, name: e.name, first: true };
      var n = Math.min(doneSets(e).length, doneSets(prev).length);
      var rNow = totalReps({ sets: doneSets(e).slice(0, n) }), rPrev = totalReps({ sets: doneSets(prev).slice(0, n) });
      var dk = topKg(e) - topKg(prev), dr = rNow - rPrev;
      return { id: e.id, name: e.name, kgFrom: topKg(prev), kgTo: topKg(e), repsFrom: rPrev, repsTo: rNow,
               better: dk > 0 || (dk === 0 && dr > 0), worse: dk < 0 || (dk === 0 && dr < 0) };
    });
  }

  // Focus deze week: drie doelen die automatisch volgen uit je logboek.
  function weeklyFocus(sessions, now, exInfo){
    var week = inWeek(sessions, now);
    var tops = {}, better = {};
    week.forEach(function(s){
      var idx = sessions.indexOf(s), before = sessions.slice(0, idx);
      s.exercises.forEach(function(e){
        var info = exInfo(e.id);
        if (info && hitTop(e, info, topKg(e))) tops[e.id] = true;
      });
      compareToPrevious(before, s).forEach(function(c){ if (c.better) better[c.id] = true; });
    });
    return [
      { key: 'top', label: 'Top van de range op 3 oefeningen', sub: 'dan stijgt het gewicht', have: Object.keys(tops).length, need: 3 },
      { key: 'better', label: 'Beter dan vorige keer op 5 oefeningen', sub: 'meer reps of meer gewicht', have: Object.keys(better).length, need: 5 },
      { key: 'full', label: 'Volle week: 5 van 5', sub: 'levert een extra vrije week op', have: week.length, need: 5 }
    ];
  }

  function e1rm(kg, reps){ return (kg > 0 && reps > 0 && reps <= 12) ? kg * (1 + reps / 30) : 0; }

  // Reeks per sessie voor de grafiek van één oefening.
  function series(sessions, exId){
    var out = [], best = 0;
    sessions.forEach(function(s){
      var e = s.exercises.find(function(x){ return x.id === exId; });
      if (!e || !doneSets(e).length) return;
      var top = topKg(e);
      var rm = doneSets(e).reduce(function(a, x){ return Math.max(a, e1rm(x.kg, x.reps)); }, 0);
      var vol = doneSets(e).reduce(function(a, x){ return a + (x.kg || 0) * (x.reps || 0); }, 0);
      var pr = top > best && best > 0;
      if (top > best) best = top;
      out.push({ t: s.endedAt, kg: top, e1rm: Math.round(rm * 10) / 10, vol: Math.round(vol), reps: totalReps(e), pr: pr });
    });
    return out;
  }

  // PR = zwaarder topgewicht dan ooit tevoren voor deze oefening.
  function prsFor(sessionsBefore, session){
    var out = [];
    session.exercises.forEach(function(e){
      var top = topKg(e); if (!top) return;
      var prevBest = entriesFor(sessionsBefore, e.id).reduce(function(a, x){ return Math.max(a, topKg(x)); }, 0);
      if (prevBest > 0 && top > prevBest) out.push({ id: e.id, name: e.name, kg: top });
    });
    return out;
  }

  // Vergelijking met ongeveer 6 weken geleden (oudste sessie van minstens 42 dagen terug, de recentste daarvan).
  function sixWeeksAgo(sessionsBefore, session){
    var cutoff = session.endedAt - 42 * DAY;
    var old = sessionsBefore.filter(function(s){ return s.endedAt <= cutoff; });
    for (var i = 0; i < session.exercises.length; i++) {
      var e = session.exercises[i];
      var then = entriesFor(old, e.id)[0];
      if (!then) continue;
      var kNow = topKg(e), kThen = topKg(then);
      if (kNow > kThen || (kNow === kThen && totalReps(e) > totalReps(then)))
        return { name: e.name, kgThen: kThen, kgNow: kNow, repsThen: totalReps(then), repsNow: totalReps(e) };
    }
    return null;
  }

  // Twee sessies op rij minder reps per set op hetzelfde gewicht: stel een stap lichter voor.
  function fatigue(sessions, ex, kg, deload){
    if (deload || !kg || !parseRange(ex.reps)) return null;
    var lo = prevStep(kg); if (lo === null) return null;
    var es = entriesFor(sessions, ex.id).slice(0, 3);
    if (es.length < 3 || !es.every(function(e){ return topKg(e) === kg && doneSets(e).length; })) return null;
    var avg = function(e){ return totalReps(e) / doneSets(e).length; };
    if (avg(es[0]) < avg(es[1]) && avg(es[1]) < avg(es[2])) return { from: kg, to: lo, reason: 'Twee sessies op rij minder reps op ' + String(kg).replace('.', ',') + ' kg.' };
    return null;
  }

  return { fatigue: fatigue, LADDER: LADDER, parseRange: parseRange, nextStep: nextStep, prevStep: prevStep, ladderIndex: ladderIndex,
           nextDayIndex: nextDayIndex, entriesFor: entriesFor, lastRepsFor: lastRepsFor, suggestion: suggestion,
           repsToNext: repsToNext, restAfter: restAfter, remaining: remaining, isComplete: isComplete, warmup: warmup,
           weekStart: weekStart, blockInfo: blockInfo, streakInfo: streakInfo, muscleSets: muscleSets,
           weeklyFocus: weeklyFocus, compareToPrevious: compareToPrevious, e1rm: e1rm, series: series,
           prsFor: prsFor, sixWeeksAgo: sixWeeksAgo, topKg: topKg, totalReps: totalReps, doneSets: doneSets };
})();
</script>

      var pi = d.exercises.findIndex(function(x){ return x.id === ex.ss; });
      if (pi >= 0) { S.active.exIdx = pi; toast('Superset: meteen door naar ' + d.exercises[pi].name); }
    } else {
      var partnerIdx = d.exercises.findIndex(function(x){ return x.ss === ex.id; });
      if (partnerIdx >= 0 && nextSetIdx(d.exercises[partnerIdx], activeEntry(d.exercises[partnerIdx])) !== null) S.active.exIdx = partnerIdx;
      else if (lastOfEx) S.active.exIdx = firstOpenEx(d, S.active.exIdx);
    }
    S.active.restEndsAt = (rest > 0 && !Rules.isComplete(S.active, d)) ? Date.now() + rest * 1000 : null;
    S.active.restTotal = rest;
    if (S.active.restEndsAt) ui.flash.timer = true;

  },
  undo: function(){

  },

  },
  swapCancel: function(){ ui.view = 'workout'; render(); },
  restAdd: function(){ if (S.active.restEndsAt) { S.active.restEndsAt += 30000; S.active.restTotal += 30; store.save(); render(); } },
  restSkip: function(){ S.active.restEndsAt = null; store.save(); render(); },
  finish: function(){
    var d = activeDay();
    var done = S.active.exercises.map(function(e){ return { id:e.id, name:e.name, sets:e.sets.filter(function(s){ return s && s.done; }) }; })
                                 .filter(function(e){ return e.sets.length; });
    if (!done.length) {
      if (confirm('Geen sets gelogd. Workout annuleren?')) { S.active = null; store.save(); ui.view = 'tabs'; ui.tab = 'today'; wake.off(); render(); }

    }
    if (!Rules.isComplete(S.active, d) && !confirm('Niet alle sets zijn af. Toch afronden?')) return;

    var session = { dayIndex: S.active.dayIndex, dayId: d.id, dayName: d.name, startedAt: S.active.startedAt, endedAt: Date.now(), light: d.light, exercises: done };
    session.prs = Rules.prsFor(before, session);
    ui.summary = buildSummary(before, session, d);

    ui.pickDay = Rules.nextDayIndex(S.sessions, PLAN.length);
    ui.view = 'done'; ui.flash.slam = true; wake.off(); render(); window.scrollTo(0, 0);
  },
  applySuggest: function(id, to){ S.kg[id] = +to; store.save(); toast(exName(id) + ' naar ' + fmtKg(+to) + ' kg'); render(); },
  doneOk: function(){ ui.view = 'tabs'; ui.tab = 'today'; render(); window.scrollTo(0, 0); },

  fold: function(k){ ui.fold[k] = !ui.fold[k]; render(); },
  planOpen: function(){ ui.view = 'plan'; render(); window.scrollTo(0, 0); },
  planDay: function(d){ ui.planDay = +d; ui.view = 'planDay'; render(); window.scrollTo(0, 0); },
  planBack: function(){ if (ui.view === 'planAdd') ui.view = 'planDay'; else if (ui.view === 'planDay') ui.view = 'plan'; else { ui.view = 'tabs'; ui.tab = 'settings'; } render(); },
  planSets: function(slot, d){ planEdit(function(day){ var x = day.exercises[+slot]; x.sets = Math.min(10, Math.max(1, x.sets + (+d))); }); },
  planRest: function(slot, d){ planEdit(function(day){ var x = day.exercises[+slot]; x.rest = Math.min(240, Math.max(15, x.rest + (+d))); }); },
  planReps: function(slot){ planEdit(function(day){ var x = day.exercises[+slot]; var i = REP_OPTIONS.indexOf(x.reps); x.reps = REP_OPTIONS[(i + 1) % REP_OPTIONS.length]; }); },
  planMove: function(slot, d){ planEdit(function(day){ var i = +slot, j = i + (+d); if (j < 0 || j >= day.exercises.length) return; var t = day.exercises[i]; day.exercises[i] = day.exercises[j]; day.exercises[j] = t; }); },

    if (!confirm('Terug naar het standaardschema? Je eigen wijzigingen gaan verloren, je logboek blijft.')) return;

  },
  deleteSession: function(i){
    var s = S.sessions[+i]; if (!s) return;

  },
  metric: function(m){ ui.progMetric = m; render(); },
  exportData: function(){ exportJson(); },
  importData: function(){ document.getElementById('importFile').click(); },
  wipe: function(){
    if (!confirm('Alle workouts en gewichten wissen?')) return;
    if (!confirm('Zeker? Dit kan niet ongedaan worden. Maak eerst een backup als je twijfelt.')) return;
    S = emptyState(); applyPlan(); store.save(); ui.pickDay = 0; toast('Alles gewist'); render();
  }
};

function buildSummary(before, session, d){
  var cmp = Rules.compareToPrevious(before, session);
  var repsDiff = 0, any = false;
  cmp.forEach(function(c){ if (!c.first && c.kgTo === c.kgFrom) { repsDiff += c.repsTo - c.repsFrom; any = true; } });
  var after = before.concat([session]);
  var next = [];
  d.exercises.forEach(function(ex){ var s = Rules.suggestion(after, ex, ex.kg, false); if (s) next.push({ id: ex.id, name: ex.name, from: s.from, to: s.to }); });
  return {
    day: d.name, sets: session.exercises.reduce(function(a, e){ return a + e.sets.length; }, 0),
    planned: d.exercises.reduce(function(a, e){ return a + e.sets; }, 0),
    mins: Math.max(1, Math.round((session.endedAt - session.startedAt) / 60000)),
    repsDiff: any ? repsDiff : null, worse: cmp.filter(function(c){ return c.worse; }).length,
    better: cmp.filter(function(c){ return c.better; }), prs: session.prs, next: next,
    ago: Rules.sixWeeksAgo(before, session), streak: Rules.streakInfo(after, session.endedAt)
  };
}

function recomputePrs(){ S.sessions.forEach(function(s, i){ s.prs = Rules.prsFor(S.sessions.slice(0, i), s); }); }
function planEdit(fn){
  if (S.active) { toast('Rond eerst je workout af'); return; }
  if (!S.plan) S.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
  applyPlan(); fn(S.plan[ui.planDay]); store.save(); render();
}

/* ============ BACKUP NAAR BESTAND ============ */
function exportJson(){
  var blob = new Blob([JSON.stringify({ app:'workout', version:VERSION, exportedAt:new Date().toISOString(), state:S }, null, 2)], { type:'application/json' });
  var name = 'workout-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var file = null;
  try { file = new File([blob], name, { type:'application/json' }); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
    navigator.share({ files:[file], title:name }).then(markExported).catch(function(){});
  } else {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); markExported();
  }
}
function markExported(){ S.lastExport = Date.now(); store.save(); toast('Backup gemaakt'); render(); }
function importText(txt){
  var data;
  try { data = JSON.parse(txt); } catch(e){ toast('Dit bestand kan ik niet lezen'); return; }
  if (!data || data.app !== 'workout' || !data.state) { toast('Dit is geen workout-backup'); return; }
  var next = migrate(data.state);
  if (!confirm('Backup met ' + next.sessions.length + ' sessies terugzetten? Dit vervangt wat nu op dit toestel staat.')) return;
  S = next; applyPlan(); store.save(); ui.view = S.active ? 'workout' : 'tabs'; ui.pickDay = Rules.nextDayIndex(S.sessions, PLAN.length);
  toast(S.sessions.length + ' sessies hersteld'); render();
}
document.getElementById('importFile').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if (!f) return;
  f.text().then(importText).catch(function(){ toast('Dit bestand kan ik niet lezen'); });
  ev.target.value = '';
});

var wake = {
  lock: null, supported: 'wakeLock' in navigator, status: 'uit',
  on: function(){
    if (!wake.supported) { wake.status = 'niet ondersteund'; return; }
    navigator.wakeLock.request('screen').then(function(l){
      wake.lock = l; wake.status = 'aan';
      l.addEventListener('release', function(){ wake.status = 'vrijgegeven'; });
    }).catch(function(e){ wake.status = 'geweigerd (' + e.name + ')'; });
  },
  off: function(){ if (wake.lock) { wake.lock.release().catch(function(){}); wake.lock = null; } wake.status = 'uit'; }
};

});

/* ============ ANIMATIE-HULP: alleen bij een nieuw scherm, niet bij elke tik ============ */
var lastScreen = null;
var motionOk = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function screenKey(){ return ui.view === 'tabs' ? 'tab:' + ui.tab + (ui.tab === 'history' ? ':' + ui.calMonth : '') : ui.view === 'workout' && S.active ? 'ex:' + S.active.exIdx : ui.view; }
function animateIn(el){
  var key = screenKey(), entering = key !== lastScreen;
  lastScreen = key;
  el.classList.toggle('entering', entering);
  if (entering && motionOk) {
    var kids = el.children.length === 1 && el.firstElementChild.classList.contains('stack') ? el.firstElementChild.children : el.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].id === 'timer') continue;
      kids[i].classList.add('in'); kids[i].style.animationDelay = Math.min(i, 8) * 35 + 'ms';
    }
    if (ui.view === 'done') countUp(el);
  }
  var f = ui.flash; ui.flash = {};
  if (f.set) { var tiles = el.querySelectorAll('.sets .set'); if (tiles[f.set.idx] && curEx().id === f.set.id) tiles[f.set.idx].classList.add('pop'); }
  if (f.rep) { var b = el.querySelector('.counter .val b'); if (b) b.classList.add('bump-' + f.rep); }
  if (f.timer) { var t = el.querySelector('#timer'); if (t) t.classList.add('slide'); }
  if (f.slam) { var h = el.querySelector('.h1'); if (h) h.classList.add('slam'); }
}
// Cijfers op het klaar-scherm tellen op van 0.
function countUp(el){
  var nodes = el.querySelectorAll('[data-count]');
  if (!nodes.length || !window.requestAnimationFrame) return;
  var t0 = null, dur = 650;
  function step(ts){
    if (t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    nodes.forEach(function(n){
      if (!n.isConnected) return;
      var to = +n.dataset.count, v = Math.round(to * e);
      n.textContent = (n.dataset.sign && v > 0 ? '+' : '') + v;
    });
    if (p < 1) requestAnimationFrame(step);
  }
  nodes.forEach(function(n){ n.textContent = '0'; });
  requestAnimationFrame(step);
}

/* ============ RENDER ============ */
function render(){
  var el = document.getElementById('app'), nav = document.getElementById('nav');
  var html;
  if (ui.view === 'workout' && S.active) html = viewWorkout();
  else if (ui.view === 'swap' && S.active) html = viewSwap();
  else if (ui.view === 'more' && S.active) html = viewMore();
  else if (ui.view === 'addEx' && S.active) html = viewAddEx();
  else if (ui.view === 'editSet' && ui.edit && S.sessions[ui.edit.si]) html = viewEditSet();
  else if (ui.view === 'plan') html = viewPlan();
  else if (ui.view === 'planDay') html = viewPlanDay();
  else if (ui.view === 'planAdd') html = viewPlanAdd();
  else if (ui.view === 'done') html = viewDone();
  else { ui.view = 'tabs'; html = ui.tab === 'history' ? viewHistory() : ui.tab === 'progress' ? viewProgress() : ui.tab === 'settings' ? viewSettings() : viewToday(); }
  el.innerHTML = html;
  animateIn(el);
  el.style.setProperty('--mc', /^(workout|swap|more|addEx)$/.test(ui.view) && S.active ? muscleVar(curEx().muscle) : 'var(--accent)');
  var showNav = ui.view === 'tabs';
  el.classList.toggle('has-nav', showNav);
  nav.hidden = !showNav;
  if (showNav) nav.innerHTML = '<div>' + [['today','Vandaag'],['history','Geschiedenis'],['progress','Progressie'],['settings','Instellingen']].map(function(t){
    return '<button data-act="tab" data-arg="' + t[0] + '" class="' + (ui.tab === t[0] ? 'on' : '') + '" aria-current="' + (ui.tab === t[0] ? 'page' : 'false') + '">' + ICON[t[0]] + t[1] + '</button>';
  }).join('') + '</div>';
  tickTimer();
}

function viewToday(){

  var ms = Rules.muscleSets(S.sessions, now, exInfo);
  var focus = Rules.weeklyFocus(S.sessions, now, exInfo);
  var h = '<div class="stack">';

  h += '<div class="daypick" role="group" aria-label="Kies dag">' + PLAN.map(function(p, i){ return '<button data-act="pick" data-arg="' + i + '" class="' + (i === ui.pickDay ? 'on' : '') + '" aria-pressed="' + (i === ui.pickDay) + '">' + esc(p.name) + '</button>'; }).join('') + '</div>';

  h += '<section class="card stack" style="gap:10px"><div class="between"><h2 class="h2">Blok ' + blk.block + ' · week ' + blk.week + ' van 6</h2><span class="small muted">week 6 = lichter</span></div>';
  h += '<div class="seg6">'; for (var w = 1; w <= 6; w++) h += '<span class="' + (w < blk.week ? 'past' : w === blk.week ? 'now' : '') + (w === 6 ? ' light' : '') + '"></span>'; h += '</div>';

  h += '<div class="between"><span>Deze week <span class="num" style="font-size:18px">' + st.thisWeek + ' / 5</span></span><span class="small muted">min. 3 · vrije weken: ' + st.free + '</span></div></section>';

  h += '<section class="card stack" style="gap:10px"><div class="between"><h2 class="h2">Sets per spiergroep</h2><span class="small muted">doel 10–20 per week</span></div><div class="bars">';
  MUSCLES.forEach(function(m){
    var n = ms[m] || 0, pct = Math.min(100, n / 20 * 100);
    h += '<span>' + m + '</span><div class="track" role="img" aria-label="' + m + ': ' + n + ' sets"><i class="' + (n >= 10 ? 'ok' : '') + '" style="background:' + muscleVar(m) + ';width:' + pct + '%"></i><b style="left:50%"></b></div><span class="num" style="text-align:right;font-size:18px">' + n + '</span>';
  });

  if (!ui.fold.focus) focus.forEach(function(f){

    h += '<div class="goal' + (ok ? ' done' : '') + '"><span class="box">' + (ok ? ICON.check : '') + '</span><div class="grow"><div style="font-weight:600">' + esc(f.label) + '</div><div class="small muted">' + Math.min(f.have, f.need) + ' / ' + f.need + ' · ' + esc(f.sub) + '</div></div></div>';

    return '<div class="item"><div><div>' + esc(ex.name) + (ex.elbow ? ' <span class="tag">elleboog</span>' : '') + '</div><div class="small muted">' + ex.sets + ' × ' + esc(ex.reps) + (ex.ss ? ' · superset' : '') + '</div></div><div class="num">' + (ex.kg ? fmtKg(ex.kg) + ' kg' : 'lichaam') + '</div></div>';
  }).join('')) + '</section>';

function viewWorkout(){
  var d = activeDay(), ex = d.exercises[S.active.exIdx], e = activeEntry(ex), idx = nextSetIdx(ex, e);
  ensureDraft();
  var prev = idx === null ? null : Rules.lastRepsFor(S.sessions, ex.id, idx);
  var sug = Rules.suggestion(S.sessions, ex, ex.kg, d.light);
  var tired = sug ? null : Rules.fatigue(S.sessions, ex, ex.kg, d.light);
  var mins = Math.floor((Date.now() - S.active.startedAt) / 60000);
  var anyDone = e.sets.some(function(s){ return s && s.done; });
  var h = '';
  h += '<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Naar start (workout blijft lopen)">' + ICON.back + '</button><span class="eyebrow">' + esc(d.name) + ' · ' + mins + ' min' + (d.light ? ' · licht' : '') + '</span><button class="icon-btn" data-act="finish" style="padding:0 12px;color:var(--accent);font-weight:600">Klaar</button></div>';
  h += '<div class="between"><div class="eyebrow acc">' + (ex.muscle ? '● ' + esc(ex.muscle) + ' · ' : '') + 'Oefening ' + (S.active.exIdx + 1) + ' / ' + d.exercises.length + (ex.ss ? ' · superset' : '') + '</div>';
  h += '<button class="icon-btn" data-act="more" aria-label="Extra set, oefening toevoegen of wisselen" style="background:var(--card2)">' + ICON.plus + '</button></div>';
  h += '<h1 class="h1">' + esc(ex.name) + '</h1>';

  if (s.better.length) h += '<section class="card list"><h2 class="h2" style="margin-bottom:4px">Wat beter ging</h2>' + s.better.map(function(b){

  h += '<div class="spacer"></div><button class="btn-big btn-light" data-act="doneOk">Verder</button></div>';

function dayColor(s){ var id = s.dayId || (PLAN[s.dayIndex] || {}).id || ''; return id.indexOf('push') === 0 ? 'var(--c-borst)' : id.indexOf('pull') === 0 ? 'var(--c-rug)' : 'var(--c-benen)'; }
function calendar(){
  var now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + ui.calMonth, 1);
  var y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate();
  var byDay = {};
  S.sessions.forEach(function(s, i){ var d = new Date(s.endedAt); if (d.getFullYear() === y && d.getMonth() === m) byDay[d.getDate()] = i; });
  var inMonth = Object.keys(byDay).length, sets = 0;
  S.sessions.forEach(function(s){ var d = new Date(s.endedAt); if (d.getFullYear() === y && d.getMonth() === m) sets += s.exercises.reduce(function(a, e){ return a + e.sets.length; }, 0); });
  var counts = {}; S.sessions.forEach(function(s){ var k = Rules.weekStart(s.endedAt); counts[k] = (counts[k] || 0) + 1; });
  var title = base.toLocaleDateString('nl-BE', { month:'long', year:'numeric' });
  var h = '<section class="card stack" style="gap:12px"><div class="between" style="align-items:center"><button class="icon-btn" data-act="calMove" data-arg="-1" aria-label="Vorige maand">' + ICON.back + '</button>';
  h += '<div style="text-align:center"><div class="h2">' + esc(title) + '</div><div class="small muted">' + inMonth + ' workout' + (inMonth === 1 ? '' : 's') + ' · ' + sets + ' sets</div></div>';
  h += '<button class="icon-btn" data-act="calMove" data-arg="1" aria-label="Volgende maand"' + (ui.calMonth >= 0 ? ' disabled style="opacity:.25;transform:scaleX(-1)"' : ' style="transform:scaleX(-1)"') + '>' + ICON.back + '</button></div>';
  h += '<div class="cal" role="grid" aria-label="Workouts in ' + esc(title) + '">' + ['ma','di','wo','do','vr','za','zo'].map(function(d){ return '<div class="dow">' + d + '</div>'; }).join('') + '<div class="dow" title="workouts die week">#</div>';
  var lead = (new Date(y, m, 1).getDay() + 6) % 7, cells = Math.ceil((lead + days) / 7) * 7;
  var todayKey = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  for (var c = 0; c < cells; c++) {
    var dn = c - lead + 1, date = new Date(y, m, dn);
    if (dn < 1 || dn > days) h += '<div class="d out" aria-hidden="true"></div>';
    else {
      var si = byDay[dn], s = si != null ? S.sessions[si] : null, fut = date.getTime() > todayKey;
      var cls = 'd' + (s ? (s.light ? ' light' : ' hit') : fut ? ' fut' : '') + (date.getTime() === todayKey ? ' today' : '');
      var lbl = dn + ' ' + esc(title) + (s ? ': ' + esc(s.dayName || PLAN[s.dayIndex].name) : '');
      h += s ? '<button class="' + cls + '" style="--dc:' + dayColor(s) + ';animation-delay:' + Math.min(dn, 31) * 12 + 'ms" data-act="calDay" data-arg="' + si + '" aria-label="' + lbl + '">' + dn + '</button>'
             : '<div class="' + cls + '" aria-label="' + lbl + '">' + dn + '</div>';
    }
    if (c % 7 === 6) {
      var ws = Rules.weekStart(new Date(y, m, c - lead + 1 - 6).getTime()), n = counts[ws] || 0;
      h += '<div class="wk' + (n >= 3 ? ' ok' : '') + '" aria-label="' + n + ' workouts die week">' + (n || '') + '</div>';
    }
  }
  h += '</div><div class="legend"><span><i style="background:var(--c-borst)"></i>Push</span><span><i style="background:var(--c-rug)"></i>Pull</span><span><i style="background:var(--c-benen)"></i>Benen</span><span><i style="border:2px solid var(--muted)"></i>lichte week</span></div></section>';
  return h;
}

function viewHistory(){
  var h = '<div class="stack"><h1 class="h1">Geschiedenis</h1>';
  if (!S.sessions.length) return h + calendar() + '<div class="card muted">Nog geen workouts. Je eerste sessie verschijnt hier.</div></div>';
  h += calendar();
  var counts = {}; S.sessions.forEach(function(s){ var k = Rules.weekStart(s.endedAt); counts[k] = (counts[k] || 0) + 1; });
  var lastWeek = null;
  for (var i = S.sessions.length - 1; i >= 0; i--) {
    var s = S.sessions[i], open = ui.openSession === i, wk = Rules.weekStart(s.endedAt);
    if (wk !== lastWeek) {
      lastWeek = wk;
      h += '<div class="weekhead"><span class="eyebrow">Week van ' + esc(fmtDate(wk, { day:'numeric', month:'short' })) + '</span><span class="num" style="font-size:16px;color:' + (counts[wk] >= 3 ? 'var(--text)' : 'var(--muted)') + '">' + counts[wk] + ' / 5</span></div>';
    }
    var sets = s.exercises.reduce(function(a, e){ return a + e.sets.length; }, 0);
    var mins = Math.max(1, Math.round((s.endedAt - s.startedAt) / 60000));
    h += '<section class="card" id="sess-' + i + '"><button style="width:100%;text-align:left" data-act="toggleSession" data-arg="' + i + '" aria-expanded="' + open + '"><div class="between"><span class="h2"><i aria-hidden="true" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:2px;background:' + dayColor(s) + '"></i>' + esc(s.dayName || PLAN[s.dayIndex].name) + '</span><span class="small muted">' + esc(fmtDate(s.endedAt)) + '</span></div>';
    h += '<div class="small muted" style="margin-top:2px">' + sets + (sets === 1 ? ' set · ' : ' sets · ') + mins + ' min' + (s.light ? ' · lichte week' : '') + (s.prs && s.prs.length ? ' · <span class="tag pr">' + s.prs.length + ' record' + (s.prs.length > 1 ? 's' : '') + '</span>' : '') + '</div></button>';
    if (open) {
      h += '<div class="list" style="margin-top:8px">' + s.exercises.map(function(e, ei){
        return '<div class="item" style="flex-wrap:wrap"><span>' + esc(e.name) + '</span><span style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end">' + e.sets.map(function(x, k){ return '<button class="chip" data-act="editSet" data-arg="' + i + '" data-arg2="' + ei + ':' + k + '" aria-label="Set ' + (k + 1) + ' aanpassen">' + x.reps + (x.kg ? '×' + fmtKg(x.kg) : '') + '</button>'; }).join('') + '</span></div>';
      }).join('') + '</div><div class="small muted" style="margin-top:6px">Tik op een set om hem aan te passen.</div><button class="btn btn-danger" style="width:100%;margin-top:10px" data-act="deleteSession" data-arg="' + i + '">Sessie verwijderen</button>';
    }
    h += '</section>';
  }
  return h + '</div>';
}

function viewProgress(){
  var ids = [];
  S.sessions.forEach(function(s){ s.exercises.forEach(function(e){ if (ids.indexOf(e.id) < 0) ids.push(e.id); }); });
  var h = '<div class="stack"><h1 class="h1">Progressie</h1>';
  if (!ids.length) return h + '<div class="card muted">Log een workout en je ziet hier per oefening je gewicht, geschat 1RM en volume.</div></div>';
  if (!ui.progEx || ids.indexOf(ui.progEx) < 0) ui.progEx = ids[0];
  var id = ui.progEx, ser = Rules.series(S.sessions, id), info = exInfo(id) || { reps:'' };
  var kg = kgFor(id, info.kg || 0);
  h += '<label class="small muted" for="progSel">Oefening</label><select id="progSel" class="pick">' + ids.map(function(x){ return '<option value="' + esc(x) + '"' + (x === id ? ' selected' : '') + '>' + esc(exName(x)) + '</option>'; }).join('') + '</select>';
  var bestKg = ser.reduce(function(a, p){ return Math.max(a, p.kg); }, 0);
  var bestRm = ser.reduce(function(a, p){ return Math.max(a, p.e1rm); }, 0);
  h += '<div class="row" style="align-items:stretch"><div class="card grow"><div class="big-num">' + (bestKg ? fmtKg(bestKg) : '–') + '<span class="small muted"> kg</span></div><div class="small muted">zwaarst</div></div><div class="card grow"><div class="big-num">' + (bestRm ? fmtKg(Math.round(bestRm)) : '–') + '<span class="small muted"> kg</span></div><div class="small muted">geschat 1RM</div></div><div class="card grow"><div class="big-num">' + ser.length + '</div><div class="small muted">sessies</div></div></div>';
  h += '<section class="card stack" style="gap:10px"><div class="between" style="align-items:center"><h2 class="h2">Per sessie</h2><div class="seg" role="group" aria-label="Meetwaarde">' + [['kg','kg'],['e1rm','1RM'],['vol','Volume']].map(function(m){ return '<button data-act="metric" data-arg="' + m[0] + '" class="' + (ui.progMetric === m[0] ? 'on' : '') + '" aria-pressed="' + (ui.progMetric === m[0]) + '">' + m[1] + '</button>'; }).join('') + '</div></div>';
  h += chart(ser, ui.progMetric) + '</section>';
  var rt = Rules.repsToNext(S.sessions, info, kg);
  if (rt) {
    var pct = Math.min(100, rt.have / rt.need * 100);
    h += '<section class="card stack" style="gap:8px"><div class="between"><h2 class="h2">Naar ' + fmtKg(rt.to) + ' kg</h2><span class="num" style="font-size:18px">' + rt.have + ' / ' + rt.need + ' reps</span></div><div class="bars" style="grid-template-columns:1fr"><div class="track" style="height:12px"><i class="ok" style="width:' + pct + '%"></i></div></div>';
    h += '<div class="small muted">' + (info.elbow ? 'Elleboogregel: je stijgt pas als je de top van de range twee sessies op rij haalt.' : 'Haal de top van de range op alle sets en de app stelt het volgende gewicht voor.') + '</div></section>';
  }
  h += '<section class="card"><h2 class="h2" style="margin-bottom:8px">Gewichtsladder</h2><div class="ladder" style="justify-content:flex-start">' + Rules.LADDER.map(function(x){
    return '<span class="num" style="height:36px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;' + (Math.abs(x - kg) < .01 ? 'background:var(--accent);color:var(--accent-ink)' : x < kg ? 'background:var(--card3)' : 'border:1px dashed #3A4260;color:var(--muted)') + '">' + fmtKg(x) + '</span>';
  }).join('') + '</div></section>';
  var recent = [];
  for (var i = S.sessions.length - 1; i >= 0 && recent.length < 5; i--) (S.sessions[i].prs || []).forEach(function(p){ if (recent.length < 5) recent.push({ name:p.name, kg:p.kg, t:S.sessions[i].endedAt }); });
  if (recent.length) h += '<section class="card list"><h2 class="h2" style="margin-bottom:4px;color:var(--info)">Recente records</h2>' + recent.map(function(r){ return '<div class="item"><span>' + esc(r.name) + '</span><span><span class="num">' + fmtKg(r.kg) + ' kg</span> <span class="small muted">' + esc(fmtDate(r.t, { day:'numeric', month:'short' })) + '</span></span></div>'; }).join('') + '</section>';
  return h + '</div>';
}

function chart(ser, metric){
  if (ser.length < 2) return '<div class="small muted">Na twee sessies van deze oefening verschijnt hier een grafiek.</div>';
  var pts = ser.slice(-12), W = 320, H = 160, L = 36, R = 8, T = 12, B = 24;
  var vals = pts.map(function(p){ return p[metric]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
  var x = function(i){ return L + (W - L - R) * (pts.length === 1 ? .5 : i / (pts.length - 1)); };
  var y = function(v){ return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
  var path = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[metric]).toFixed(1); }).join(' ');
  var unit = metric === 'vol' ? 'kg·reps' : 'kg';
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (metric === 'kg' ? 'Zwaarste set' : metric === 'e1rm' ? 'Geschat 1RM' : 'Volume') + ' per sessie, van ' + fmtKg(vals[0]) + ' naar ' + fmtKg(vals[vals.length - 1]) + ' ' + unit + '">';
  [lo, (lo + hi) / 2, hi].forEach(function(v){ s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#2A3150"/><text x="0" y="' + (y(v) + 4) + '" fill="#9AA1B8" font-size="11" font-family="Big Shoulders Display">' + fmtKg(Math.round(v * 10) / 10) + '</text>'; });
  s += '<text x="' + L + '" y="' + (H - 4) + '" fill="#9AA1B8" font-size="11" font-family="Manrope">' + esc(fmtDate(pts[0].t, { day:'numeric', month:'short' })) + '</text>';
  s += '<text x="' + (W - R) + '" y="' + (H - 4) + '" fill="#9AA1B8" font-size="11" font-family="Manrope" text-anchor="end">' + esc(fmtDate(pts[pts.length - 1].t, { day:'numeric', month:'short' })) + '</text>';
  s += '<path d="' + path + '" fill="none" stroke="#EEF0F7" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p, i){ s += p.pr ? '<circle cx="' + x(i) + '" cy="' + y(p[metric]) + '" r="6" fill="#FFC23D" stroke="#191F33" stroke-width="2"/>' : '<circle cx="' + x(i) + '" cy="' + y(p[metric]) + '" r="3.5" fill="#EEF0F7"/>'; });
  s += '</svg>';
  if (pts.some(function(p){ return p.pr; })) s += '<div class="small muted"><span style="color:var(--info)">●</span> nieuw record</div>';
  return s;
}

function viewSettings(){
  var days = S.lastExport ? Math.floor((Date.now() - S.lastExport) / 86400000) : null;
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var h = '<div class="stack"><h1 class="h1">Instellingen</h1>';
  h += '<button class="card" style="width:100%;text-align:left" data-act="planOpen"><div class="between" style="align-items:center"><div><div class="h2">Schema aanpassen</div><div class="small muted" style="margin-top:2px">' + (S.plan ? 'Eigen schema' : 'Standaardschema') + ' · oefeningen, sets, reps, rust</div></div><span style="transform:rotate(-90deg);display:inline-flex">' + ICON.chev + '</span></div></button>';
  h += '<section class="card stack" style="gap:10px"><h2 class="h2">Backup</h2><div class="small muted">Je data staat alleen op deze telefoon. ' + (days === null ? 'Nog geen backup gemaakt.' : 'Laatste backup ' + (days === 0 ? 'vandaag' : days + ' dagen geleden') + '.') + ' Bewaar het bestand in Bestanden of iCloud Drive.</div>';
  h += '<div class="row"><button class="btn grow" data-act="exportData">Backup maken</button><button class="btn grow" data-act="importData">Terugzetten</button></div></section>';
  h += '<section class="card diag"><div class="h2" style="color:var(--text);margin-bottom:6px;font-family:var(--cond)">Toestel</div>' + [
    'homescreen-app: ' + (standalone ? 'ja' : 'nee'),
    'offline: ' + swStatus,
    'opslag: ' + (storageOk ? 'ok' : 'NIET beschikbaar'),
    'scherm aan: ' + (wake.supported ? wake.status : 'niet ondersteund'),
    'sessies: ' + S.sessions.length,
    'versie: ' + VERSION
  ].map(esc).join('<br>') + '</section>';
  h += '<button class="btn btn-danger" data-act="wipe">Alle data wissen</button>';
  return h + '</div>';
}

/* ============ TIMER: rekent op kloktijd, update enkel tekst ============ */
var tickHandle = null;
function tickTimer(){
  clearInterval(tickHandle); tickHandle = null;
  if (!S.active || !S.active.restEndsAt || ui.view !== 'workout') return;
  var upd = function(){
    if (!S.active || !S.active.restEndsAt) return;
    var left = Rules.remaining(S.active.restEndsAt, Date.now());
    var box = document.getElementById('timer'); if (!box) return;
    var over = left <= 0, a = Math.abs(left);
    document.getElementById('timerVal').textContent = (over ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
    document.getElementById('timerLabel').textContent = over ? 'Rust voorbij' : 'Rust';
    document.getElementById('timerBar').style.width = (over ? 0 : Math.max(0, Math.min(100, left / S.active.restTotal * 100))) + '%';
    box.classList.toggle('over', over);
    if (over && !box.dataset.buzzed) { box.dataset.buzzed = '1'; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  };
  upd(); tickHandle = setInterval(upd, 250);
}

/* ============ EVENTS: één delegatie-handler ============ */
function onAct(ev){
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var fn = actions[b.dataset.act]; if (!fn) return;
  fn(b.dataset.arg, b.dataset.arg2);
}
document.getElementById('app').addEventListener('click', onAct);
// Na de binnenkomst-animatie de klasse weghalen, anders blokkeert ze het indrukeffect van knoppen.
document.getElementById('app').addEventListener('animationend', function(ev){
  var c = ev.target.classList;
  if (c.contains('in')) { c.remove('in'); ev.target.style.animationDelay = ''; }
  c.remove('pop', 'bump-up', 'bump-down', 'slam');
});
document.getElementById('nav').addEventListener('click', onAct);
document.getElementById('app').addEventListener('change', function(ev){
  if (ev.target.id === 'progSel') { ui.progEx = ev.target.value; render(); }
});

/* ============ OFFLINE ============ */
var swStatus = 'niet ondersteund';
if ('serviceWorker' in navigator) {
  swStatus = 'bezig…';
  navigator.serviceWorker.register('sw.js').then(function(){ swStatus = 'klaar'; }).catch(function(e){ swStatus = 'fout: ' + e.message; });
}

render();
</script>
